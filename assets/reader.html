  <style>
    :root{--bg:#f4f3ed;--paper:#fffefa;--ink:#202f29;--muted:#6b756e;--line:#dadfd5;--green:#365b48;--soft:#e8eee4;--accent:#bd562d}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button,a{ -webkit-tap-highlight-color:transparent}button{color:inherit;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ca7747;outline-offset:3px}button{border:0;background:none}a{color:var(--green)}.topbar{height:78px;display:flex;align-items:center;gap:32px;padding:0 32px;border-bottom:1px solid var(--line);background:var(--paper)}.brand{display:flex;align-items:center;gap:12px;min-width:194px}.brand-symbol{font-family:Georgia,serif;font-size:27px;border:1px solid var(--green);width:37px;height:41px;border-radius:2px 10px 2px 2px;text-align:center;line-height:38px;color:var(--green)}.brand-name{font-size:18px;font-weight:650;letter-spacing:-.5px}.brand-sub{font-size:10px;color:var(--muted);letter-spacing:2px}.search-wrap{position:relative;flex:1;max-width:600px}.search-wrap span{position:absolute;left:15px;top:9px;font-size:19px;color:var(--muted)}#search{width:100%;height:42px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:0 65px 0 44px;color:var(--ink)}.key-hint{position:absolute;right:12px;top:11px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px} .mode{margin-left:auto;font-size:11px;white-space:nowrap;color:var(--muted);display:flex;align-items:center;gap:8px}.dot{height:6px;width:6px;border-radius:50%;background:var(--green)}.app{display:grid;grid-template-columns:224px 342px minmax(0,1fr);min-height:calc(100vh - 78px)}.sidebar{padding:29px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:28px}.eyebrow{font-size:10px;letter-spacing:1.8px;font-weight:650;text-transform:uppercase;color:var(--muted);margin-bottom:11px}.nav{display:flex;flex-direction:column;gap:4px}.nav button{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:10px 11px;border-radius:5px;font-size:13px}.nav button.active{background:var(--soft);color:var(--green);font-weight:650}.nav button:hover{background:#e9ebe4}.count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}.shelf-item{display:block;text-align:left;width:100%;padding:12px 0;border-bottom:1px solid var(--line)}.shelf-item.active{color:var(--accent)}.shelf-item span{display:block;font-size:12px;line-height:1.65}.shelf-item small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.progress-track{display:block!important;height:3px;background:#dfe4da;margin-top:8px;overflow:hidden}.progress-track i{display:block;height:100%;background:#7b947d}.sidebar-footer{margin-top:auto;padding-top:40px;color:var(--muted);font-size:10px}.sidebar-footer p{margin:0 0 10px}.sidebar-footer a{display:inline-block;margin-top:6px}.reset{font-size:10px;padding:0;text-decoration:underline;text-underline-offset:3px;color:var(--muted)}.list-panel{padding:28px 22px;border-right:1px solid var(--line);min-width:0}.list-heading{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.list-heading h1{font-size:20px;font-weight:550;margin:0;letter-spacing:-.7px}.list-heading span{font-size:11px;color:var(--muted)}.list-desc{font-size:12px;color:var(--muted);margin:0 0 20px}.filter-row{display:flex;align-items:center;gap:10px;margin-bottom:20px}.filter-row label{font-size:11px;color:var(--muted)}#kind{border:1px solid var(--line);border-radius:4px;background:transparent;padding:4px 7px;font-size:11px;min-width:110px}.result-card{width:100%;text-align:left;border:1px solid transparent;border-radius:7px;padding:15px 14px;margin-bottom:9px;display:block;transition:background .12s}.result-card:hover{background:#ecefe6}.result-card.selected{background:var(--paper);border-color:var(--line);box-shadow:0 3px 7px #20302905}.result-meta{display:flex;gap:8px;align-items:center;font-size:10px;color:var(--muted);margin-bottom:9px}.result-kind{color:var(--green);font-weight:600}.result-card h2{font-size:14px;line-height:1.6;margin:0 0 7px;font-weight:600}.result-card p{font-size:11px;line-height:1.9;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.result-source{font-size:10px;color:var(--muted);margin-top:10px;display:block}.read-indicator{margin-left:auto;color:var(--green)}.reader{background:var(--paper);min-width:0}.reader-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 36px;border-bottom:1px solid var(--line);min-height:68px}.breadcrumb{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.reader-actions{display:flex;gap:8px;flex-shrink:0}.small-button{border:1px solid var(--line);border-radius:5px;padding:6px 10px;font-size:11px}.small-button:hover{background:var(--soft)}.small-button.done{background:var(--soft);border-color:var(--soft);color:var(--green)}.reader-inner{max-width:790px;margin:0 auto;padding:40px 48px 60px}.reader-kicker{font-size:10px;letter-spacing:1.7px;color:var(--accent);font-weight:600}.reader-title{font-family:Georgia,"Songti SC","STSong",serif;font-weight:500;font-size:30px;letter-spacing:-1px;line-height:1.4;margin:14px 0 16px}.reader-info{font-size:11px;color:var(--muted);padding-bottom:24px;border-bottom:1px solid var(--line);margin-bottom:26px}.prose{font-size:14px;line-height:2.1;overflow-wrap:anywhere}.prose h1{font-size:22px;line-height:1.5}.prose h2{font-size:17px;font-weight:600;line-height:1.6;margin:30px 0 11px}.prose h3{font-size:15px;margin:24px 0 9px}.prose p{margin:0 0 18px}.prose ul{padding-left:21px;margin:0 0 19px}.prose blockquote{border-left:2px solid #afc0ac;padding-left:15px;color:var(--muted);margin:22px 0}.prose code{background:var(--bg);padding:2px 5px;border-radius:3px;font-size:12px}.prose .source-link{font-size:inherit;line-height:inherit;padding:0;color:var(--green);text-decoration:underline;text-underline-offset:4px;text-align:left}.reference-box{background:var(--bg);border:1px solid var(--line);padding:18px 20px;border-radius:6px;margin-top:32px}.reference-box h3{font-size:11px;margin:0 0 9px;font-weight:600}.reference-box button{display:block;text-align:left;font-size:12px;line-height:1.7;padding:5px 0;color:var(--green)}.pager{display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line);margin-top:35px;padding-top:18px}.pager button{font-size:11px;text-align:left;padding:5px 0}.pager button:disabled{opacity:.35;cursor:default}.reader-status{font-size:10px;color:var(--muted);margin-top:14px}mark{background:#f5dfae;color:inherit;padding:0 1px;border-radius:2px}.empty{font-size:13px;color:var(--muted);padding:30px 0;line-height:1.9}.demo-banner{padding:9px 32px;background:#e9eee4;border-bottom:1px solid var(--line);font-size:11px;color:#536650;display:flex;justify-content:space-between;gap:20px}.demo-banner a{white-space:nowrap}.mobile-back{display:none}.no-reader{padding:60px 45px;color:var(--muted)}.skip-link{position:absolute;top:-100px;left:20px;z-index:10;background:var(--paper);padding:10px}.skip-link:focus{top:10px}#storage-status{color:#915328} [hidden]{display:none!important}
    @media(min-width:1500px){.app{grid-template-columns:246px 390px minmax(0,1fr)}.sidebar{padding-left:30px;padding-right:28px}.reader-inner{padding-top:54px}.list-panel{padding-left:28px;padding-right:28px}}
    @media(max-width:1100px){.app{grid-template-columns:180px 290px minmax(0,1fr)}.topbar{padding:0 22px;gap:18px}.brand{min-width:160px}.reader-inner{padding:30px 28px}.reader-title{font-size:26px}.reader-toolbar{padding:18px 24px}.sidebar{padding:24px 16px}.list-panel{padding:24px 16px}.mode{font-size:10px}}
    @media(max-width:850px){.app{grid-template-columns:175px minmax(0,1fr)}.reader{grid-column:2}.list-panel{grid-column:2;grid-row:1}.sidebar{grid-column:1;grid-row:1/3}.reader{display:none}body.reading .list-panel{display:none}body.reading .reader{display:block;grid-row:1}.mobile-back{display:inline-block}.reader-title{font-size:28px}.reader-actions{gap:5px}.mode{display:none}.topbar{height:72px}.search-wrap{max-width:none}.app{min-height:calc(100vh - 108px)}}
    @media(max-width:560px){.topbar{height:auto;min-height:72px;flex-wrap:wrap;padding:14px 18px;gap:14px}.brand{min-width:0}.brand-sub{display:none}.brand-symbol{width:29px;height:33px;font-size:22px;line-height:30px}.brand-name{font-size:17px}.search-wrap{flex-basis:100%}.key-hint{display:none}#search{padding-right:12px}.app{display:block}.sidebar{padding:18px;border-right:0;border-bottom:1px solid var(--line);display:block}.sidebar>.shelves,.sidebar-footer{display:none}.sidebar>.views>.eyebrow{display:none}.nav{flex-direction:row;gap:5px}.nav button{flex:1;gap:12px;justify-content:center;font-size:12px;padding:8px 5px}.list-panel{border-right:0;padding:24px 18px}.demo-banner{padding:8px 18px;font-size:10px}.demo-banner a{display:none}.reader-toolbar{padding:14px 18px}.reader-inner{padding:28px 24px 40px}.reader-title{font-size:26px}.prose{font-size:14px}.breadcrumb{max-width:120px}.reader-actions .small-button{font-size:10px;padding:5px 7px}}
  </style>

<body>
<a href="#content" class="skip-link">跳到阅读正文</a>
<header class="topbar">
  <div class="brand"><span class="brand-symbol" aria-hidden="true">b</span><div><div class="brand-name">Book Wiki</div><div class="brand-sub">READ. THINK. RETURN.</div></div></div>
  <div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="从一个问题、一段原文开始找…" aria-label="搜索原文和笔记" autocomplete="off"><kbd class="key-hint">⌘ K</kbd></div>
  <div class="mode"><span class="dot"></span>离线阅读 · 数据在当前文件中</div>
</header>
<div id="demo-banner" class="demo-banner" hidden><span>公开演示 / 两篇原创短文与人工编写的示例笔记，可直接检索和跳转。</span><a href="https://github.com/ginbrooks/book-wiki-reader-skill" target="_blank" rel="noopener noreferrer">在自己的书库中使用 ↗</a></div>
<main class="app">
  <aside class="sidebar" aria-label="书库导航">
    <div class="views"><div class="eyebrow">WORKSPACE / 阅读工作台</div><nav class="nav"><button data-view="all" class="active">全部内容 <span class="count" id="all-count"></span></button><button data-view="notes">我的笔记 <span class="count" id="note-count"></span></button><button data-view="unread">待阅读 <span class="count" id="unread-count"></span></button></nav></div>
    <div class="shelves"><div class="eyebrow">LIBRARY / 我的书架</div><div id="shelves"></div></div>
    <div class="sidebar-footer"><p>原文、作者观点与读者判断，<br>各自保留，随时回到来源。</p><p id="storage-status">阅读进度仅保存在这个浏览器中。</p><button id="reset-progress" class="reset">清除本地阅读进度</button><br><a href="https://github.com/ginbrooks/book-wiki-reader-skill" target="_blank" rel="noopener noreferrer">Book Wiki Reader ↗</a></div>
  </aside>
  <section class="list-panel" aria-label="内容列表"><div class="list-heading"><h1 id="list-title">从这里继续读</h1><span id="result-count" role="status" aria-live="polite"></span></div><p id="list-desc" class="list-desc">让每一条理解，都能找到来处。</p><div class="filter-row"><label for="kind">内容类型</label><select id="kind"><option value="">全部类型</option></select></div><div id="results"></div></section>
  <section class="reader" aria-label="阅读器"><div id="reader-body"></div></section>
</main>
<script id="library-data" type="application/json">__BOOK_WIKI_DATA__</script>
<script>
'use strict';
const library = JSON.parse(document.getElementById('library-data').textContent);
const documents = library.documents;
const byId = new Map(documents.map(d => [d.id,d]));
const byBook = new Map(library.books.map(b => [b.id,b]));
const $ = id => document.getElementById(id);
let view='all', bookFilter=null, selected=null, query='', kind='';
const storageKey='book-wiki-reader:'+library.id;
let progress={};
try {const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))progress=saved;} catch(e){$('storage-status').textContent='当前浏览器不允许保存，进度仅在本次打开时有效。';}
const readIds = new Set(Array.isArray(progress.read)?progress.read.filter(id=>byId.has(id)):[]);
function save(){try{localStorage.setItem(storageKey,JSON.stringify({read:[...readIds],last:selected}));}catch(e){$('storage-status').textContent='进度仅在本次打开时有效。';}}
function el(tag, cls, text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node;}
function terms(){return query.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);}
function markText(node,text){const searchTerms=terms();if(!searchTerms.length){node.append(document.createTextNode(text));return;}const lower=text.toLocaleLowerCase();let offset=0;while(offset<text.length){let pos=-1,word='';for(const term of searchTerms){const found=lower.indexOf(term,offset);if(found!==-1&&(pos===-1||found<pos)){pos=found;word=term;}}if(pos===-1){node.append(document.createTextNode(text.slice(offset)));break;}node.append(document.createTextNode(text.slice(offset,pos)));node.append(el('mark','',text.slice(pos,pos+word.length)));offset=pos+word.length;}}
function excerpt(doc){const text=doc.text.replace(/^#{1,6}\s+/gm,'').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/\s+/g,' ');const term=terms()[0];const index=term?text.toLocaleLowerCase().indexOf(term):-1;const start=Math.max(0,index-30);return(start?'…':'')+text.slice(start,start+118)+(text.length>start+118?'…':'');}
function listDocs(){return documents.filter(doc=>{if(bookFilter&&doc.book!==bookFilter)return false;if(kind&&doc.kind!==kind)return false;if(view==='notes'&&doc.kind==='原文')return false;if(view==='unread'&&(doc.kind!=='原文'||readIds.has(doc.id)))return false;const haystack=(doc.title+' '+doc.text).toLocaleLowerCase();return terms().every(term=>haystack.includes(term));}).sort((a,b)=>{if(query){const score=d=>terms().filter(t=>d.title.toLocaleLowerCase().includes(t)).length;return score(b)-score(a);}return (a.kind==='原文')-(b.kind==='原文');});}
function renderShelves(){const shelves=$('shelves');shelves.replaceChildren();for(const book of library.books){const button=el('button','shelf-item'+(bookFilter===book.id?' active':''));button.append(el('span','',book.title));const done=book.chunks.filter(id=>readIds.has(id)).length;button.append(el('small','',book.chunks.length?`${done} / ${book.chunks.length} 段已读`:'尚无可读原文'));const track=el('span','progress-track');const bar=el('i');bar.style.width=(book.chunks.length?done/book.chunks.length*100:0)+'%';track.append(bar);button.append(track);button.addEventListener('click',()=>{bookFilter=bookFilter===book.id?null:book.id;view='all';render();showList();});shelves.append(button);}}
function renderList(){const docs=listDocs();$('all-count').textContent=documents.length;$('note-count').textContent=documents.filter(d=>d.kind!=='原文').length;$('unread-count').textContent=documents.filter(d=>d.kind==='原文'&&!readIds.has(d.id)).length;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('list-title').textContent=query?'检索结果':bookFilter?byBook.get(bookFilter).title:view==='notes'?'留给未来的自己':view==='unread'?'下一段，从这里开始':'从这里继续读';$('list-desc').textContent=query?'多个关键词以空格分隔；匹配原文和笔记中的全部关键词。':bookFilter?'读原文，也看看留下了什么。':'让每一条理解，都能找到来处。';$('result-count').textContent=docs.length+' 篇';const results=$('results');results.replaceChildren();for(const doc of docs){const card=el('button','result-card'+(selected===doc.id?' selected':''));card.setAttribute('aria-pressed',String(selected===doc.id));const meta=el('div','result-meta');meta.append(el('span','result-kind',doc.kind),el('span','',doc.text.length.toLocaleString()+' 字符'));if(readIds.has(doc.id))meta.append(el('span','read-indicator','已读 ✓'));card.append(meta);const title=el('h2');markText(title,doc.title);card.append(title);const summary=el('p');markText(summary,excerpt(doc));card.append(summary);card.append(el('span','result-source',doc.book?byBook.get(doc.book).title:'跨书知识 · '+doc.kind));card.addEventListener('click',()=>openDoc(doc.id));results.append(card);}if(!docs.length)results.append(el('p','empty',query?'没有匹配的内容。试试更短的关键词，或清除书籍和类型筛选。':view==='unread'?'当前范围的原文都已标记读完。':'当前范围还没有内容。导入读物或写好 Markdown 笔记后，重新生成工作台。'));}
function resolveDoc(target,doc){let path=target.split('#')[0];try{path=decodeURIComponent(path);}catch(e){}if(byId.has(path))return path;const parts=doc.id.split('/').slice(0,-1);for(const part of path.split('/')){if(part==='..')parts.pop();else if(part!=='.'&&part)parts.push(part);}const candidate=parts.join('/');return byId.has(candidate)?candidate:null;}
function inline(node,text,doc){const pattern=/\[([^\]]+)\]\(([^)]+)\)|\*\*([^*]+)\*\*|`([^`]+)`/g;let index=0;for(const match of text.matchAll(pattern)){markText(node,text.slice(index,match.index));if(match[1]){const target=resolveDoc(match[2],doc);if(target){const button=el('button','source-link',match[1]+' ↗');button.addEventListener('click',()=>openDoc(target));node.append(button);}else if(/^https?:\/\//i.test(match[2])){const a=el('a','',match[1]);a.href=match[2];a.target='_blank';a.rel='noopener noreferrer';node.append(a);}else{markText(node,match[1]);}}else{const child=el(match[3]?'strong':'code');markText(child,match[3]||match[4]);node.append(child);}index=match.index+match[0].length;}markText(node,text.slice(index));}
function prose(doc){const area=el('article','prose');area.id='content';let para=[],list=null;const flush=()=>{if(para.length){const p=el('p');inline(p,para.join('\n'),doc);area.append(p);para=[];}list=null;};for(const [number,line] of doc.text.split('\n').entries()){if(number===0&&/^#{1,3}\s+/.test(line)&&line.replace(/^#{1,3}\s+/,'')===doc.title)continue;const heading=/^(#{1,3})\s+(.+)$/.exec(line);if(heading){flush();const h=el('h'+Math.max(2,heading[1].length));inline(h,heading[2],doc);area.append(h);}else if(/^\s*[-*]\s+/.test(line)){if(para.length)flush();if(!list){list=el('ul');area.append(list);}const li=el('li');inline(li,line.replace(/^\s*[-*]\s+/,''),doc);list.append(li);}else if(line.startsWith('> ')){flush();const quote=el('blockquote');inline(quote,line.slice(2),doc);area.append(quote);}else if(!line.trim()){flush();}else{list=null;para.push(line);}}flush();return area;}
function renderReader(){const body=$('reader-body');body.replaceChildren();const doc=byId.get(selected);if(!doc){body.append(el('div','no-reader','选择一段原文或一条笔记，开始阅读。'));return;}const book=byBook.get(doc.book);const toolbar=el('div','reader-toolbar');const back=el('button','small-button mobile-back','← 列表');back.addEventListener('click',()=>showList());toolbar.append(back,el('span','breadcrumb',doc.kind+' / '+(book?book.title:'跨书知识')));const actions=el('div','reader-actions');if(doc.kind==='原文'){const toggle=el('button','small-button'+(readIds.has(doc.id)?' done':''),readIds.has(doc.id)?'已读 ✓':'标为已读');toggle.addEventListener('click',()=>{readIds.has(doc.id)?readIds.delete(doc.id):readIds.add(doc.id);save();render();});actions.append(toggle);}const copy=el('button','small-button','复制引用');copy.addEventListener('click',async()=>{const value=`${book?book.title:doc.title} · ${doc.kind}\n${doc.id}`;try{await navigator.clipboard.writeText(value);copy.textContent='已复制';}catch(e){const box=el('textarea');box.value=value;box.setAttribute('aria-label','引用路径，按复制快捷键复制');body.append(box);box.focus();box.select();copy.textContent='请复制下方路径';}});actions.append(copy);toolbar.append(actions);body.append(toolbar);const inner=el('div','reader-inner');const chunkIndex=book?book.chunks.indexOf(doc.id):-1;inner.append(el('div','reader-kicker',doc.kind==='原文'?`SOURCE / 原文 ${chunkIndex+1} OF ${book.chunks.length}`:'NOTE / 笔记与理解'));inner.append(el('h1','reader-title',doc.title));inner.append(el('div','reader-info',[book?book.author:'人工整理的 Markdown 笔记',doc.text.length.toLocaleString()+' 字符',library.demo?'原创演示材料':'本地书库'].filter(Boolean).join(' · ')));inner.append(prose(doc));let related=[];if(doc.kind==='原文'){related=documents.filter(d=>d.references.includes(doc.id)||(d.kind==='读书笔记'&&d.book===doc.book));}else if(doc.references.length){related=doc.references.map(id=>byId.get(id));}else if(book){related=book.chunks.slice(0,1).map(id=>byId.get(id));}if(related.length){const ref=el('div','reference-box');ref.append(el('h3','',doc.kind==='原文'?'阅读这段原文时留下的笔记':'回到来源'));for(const item of related){const button=el('button','',`${item.kind} · ${item.title} ↗`);button.addEventListener('click',()=>openDoc(item.id));ref.append(button);}inner.append(ref);}if(chunkIndex!==-1){const pager=el('div','pager');for(const [label,index]of[['← 上一段',chunkIndex-1],['下一段 →',chunkIndex+1]]){const button=el('button','',label);button.disabled=index<0||index>=book.chunks.length;if(!button.disabled)button.addEventListener('click',()=>openDoc(book.chunks[index]));pager.append(button);}inner.append(pager);}inner.append(el('p','reader-status',doc.id));body.append(inner);}
function showList(){document.body.classList.remove('reading');window.scrollTo({top:0,behavior:'instant'});}
function render(){renderShelves();renderList();renderReader();}
function openDoc(id,updateHash=true){if(!byId.has(id))return;selected=id;save();if(updateHash)history.replaceState(null,'','#'+encodeURIComponent(id));renderList();renderReader();document.body.classList.add('reading');window.scrollTo({top:0,behavior:'instant'});}
function readHash(){try{return decodeURIComponent(location.hash.slice(1));}catch(e){return '';}}
$('search').addEventListener('input',e=>{query=e.target.value;renderList();renderReader();showList();});$('kind').addEventListener('change',e=>{kind=e.target.value;renderList();showList();});document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{view=button.dataset.view;bookFilter=null;render();showList();}));for(const value of [...new Set(documents.map(d=>d.kind))]){const option=el('option','',value);option.value=value;$('kind').append(option);}$('reset-progress').addEventListener('click',()=>{readIds.clear();save();render();});document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key==='k'){event.preventDefault();$('search').focus();}});window.addEventListener('hashchange',()=>openDoc(readHash(),false));$('demo-banner').hidden=!library.demo;selected=byId.has(readHash())?readHash():byId.has(progress.last)?progress.last:documents.find(d=>d.kind==='读书笔记')?.id||documents[0]?.id||null;render();if(readHash()&&selected)document.body.classList.add('reading');
</script>
